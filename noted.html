<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>حجز موعد</title>
</head>
<body>
<h2>احجز موعدك الآن</h2>
<form id="appointment-form">
  <input type="text" name="name" placeholder="الاسم الكامل" required><br>
  <input type="email" name="email" placeholder="البريد الإلكتروني" required><br>
  <input type="date" name="date" required><br>
  <input type="time" name="time" required><br>
  <textarea name="message" placeholder="ملاحظات إضافية"></textarea><br>
  <button type="submit">حجز الموعد</button>
</form>

<p id="status"></p>

<script>
const form = document.getElementById("appointment-form");
form.addEventListener("submit", function(e) {
  e.preventDefault();
  const formData = new FormData(form);
  const params = new URLSearchParams(formData);

  fetch("https://script.google.com/macros/library/d/12QYZzJ5m01aIP1AqiTjqUyOkx8IBMkG_UJ152_lVbCYjbLIWAP5z6M-H/2", { // ضع رابط Web App هنا
    method: "POST",
    body: params
  })
  .then(response => response.text())
  .then(data => {
    if(data === "Success") {
      document.getElementById("status").innerHTML = `
        تم حجز موعدك بنجاح!<br>
        رابط Zoom: <a href="https://us05web.zoom.us/j/7070867439?pwd=VyuXGHySabGpqTyI1cxE9IsXFRS2dg.1&omn=86997558650" target="_blank">اضغط هنا للانضمام</a>
      `;
      form.reset();
    } else {
      document.getElementById("status").innerText = "حدث خطأ أثناء الحجز.";
    }
  })
  .catch(err => {
    document.getElementById("status").innerText = "خطأ: " + err;
  });
});
</script>
</body>
</html>
